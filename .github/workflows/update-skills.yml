name: Update Skills Index & Bundle

on:
  push:
    branches: [main]
    paths:
      - 'ai-agent-skills/**'
      - '.github/scripts/**'
      - '.github/workflows/update-skills.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skills-catalog-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository and pinned submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install metadata validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate all skill frontmatter
        run: python .github/scripts/check_skill_frontmatter.py

      - name: Run static security and provenance screening
        run: python .github/scripts/audit_skill_security.py --root . --report audit-report.json

      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-security-audit
          path: audit-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate skill index and distributable bundle
        run: python .github/scripts/build_skill_catalog.py

      - name: Commit updated index
        run: |
          git config user.name "luo-kai-bot"
          git config user.email "luokai0@users.noreply.github.com"
          git add skills-index.json
          if git diff --cached --quiet; then
            echo "Skill index unchanged"
          else
            TOTAL=$(python -c "import json; print(json.load(open('skills-index.json'))['total'])")
            git commit -m "chore: refresh skill catalog ($TOTAL skills) [skip ci]"
            git push
          fi

      - name: Create versioned skills release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skills-${{ github.run_number }}
          name: Skills Bundle ${{ github.run_number }}
          body: |
            ## Luo Kai AI Agent Skills

            Generated from the validated main branch.

            The bundle contains the current skill collection. Third-party materials retain their original licenses and attribution. See LICENSE, THIRD_PARTY_NOTICES.md, and SOURCES.md.
          files: skills-bundle.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
