name: Consolidate Windows Skills

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the validated migration and commit it to main"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate and preview the full migration
        run: python scripts/maintenance/consolidate_windows_skill_workflows.py

      - name: Apply consolidation
        if: inputs.apply
        run: |
          python scripts/maintenance/consolidate_windows_skill_workflows.py --apply
          python scripts/maintenance/validate_operating_skill_quality.py
          python scripts/maintenance/check_skill_frontmatter.py

      - name: Commit and push the consolidated Windows collection
        if: inputs.apply
        run: |
          git config user.name "Luo Kai"
          git config user.email "luokai0@users.noreply.github.com"
          git add -A -- "ai-agent-skills/23-windows-computer-operations (by Luo Kai)" docs/SKILL_MERGE_MAP.md docs/SKILL_CONSOLIDATION_AUDIT.md
          if git diff --cached --quiet; then
            echo "No consolidation changes to commit"
            exit 1
          fi
          git commit -m "feat(windows): consolidate all remaining domain workflows [skip ci]"
          git push origin HEAD:main
