name: Normalize Original Skills and Rights Metadata

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the validated metadata and wording repairs"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Preview Windows profile normalization
        run: python scripts/maintenance/normalize_consolidated_windows_skills.py
      - name: Preview original-work license metadata removal
        run: python scripts/maintenance/strip_original_license_metadata.py
      - name: Preview collection copyright notice migration
        run: python scripts/maintenance/rename_original_rights_notices.py
      - name: Apply validated repairs
        if: inputs.apply
        run: |
          python scripts/maintenance/normalize_consolidated_windows_skills.py --apply
          python scripts/maintenance/strip_original_license_metadata.py --apply
          python scripts/maintenance/rename_original_rights_notices.py --apply
          python scripts/maintenance/validate_operating_skill_quality.py
          python scripts/maintenance/check_skill_frontmatter.py
      - name: Commit and push
        if: inputs.apply
        run: |
          git config user.name "Luo Kai"
          git config user.email "luokai0@users.noreply.github.com"
          git add -A -- ai-agent-skills scripts/maintenance
          if git diff --cached --quiet; then
            echo "No normalization changes to commit"
            exit 1
          fi
          git commit -m "chore: normalize original skill metadata and profiles [skip ci]"
          git push origin HEAD:main
