name: Audit Repository-wide Skill Overlaps

on:
  workflow_dispatch:
    inputs:
      write_report:
        description: "Write the full read-only audit report and commit it to main"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  audit-overlaps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main and pinned submodules
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Run repository-wide audit
        run: |
          if [ "${{ inputs.write_report }}" = "true" ]; then
            python scripts/maintenance/audit_repository_wide_skill_overlaps.py --write
          else
            python scripts/maintenance/audit_repository_wide_skill_overlaps.py
          fi
      - name: Commit report
        if: inputs.write_report
        run: |
          git config user.name "Luo Kai"
          git config user.email "luokai0@users.noreply.github.com"
          git add docs/REPOSITORY_WIDE_OVERLAP_AUDIT.md
          if git diff --cached --quiet; then
            echo "No audit report changes"
            exit 1
          fi
          git commit -m "docs: add repository-wide skill overlap audit [skip ci]"
          git push origin HEAD:main
