name: Clean Consolidated Profile Identity

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the validated profile cleanup and commit to main"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  clean-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Preview profile cleanup
        run: python scripts/maintenance/clean_consolidated_profile_identity.py
      - name: Apply profile cleanup and validate
        if: inputs.apply
        run: |
          python scripts/maintenance/clean_consolidated_profile_identity.py --apply
          python scripts/maintenance/validate_operating_skill_quality.py
          python scripts/maintenance/check_skill_frontmatter.py
      - name: Commit and push
        if: inputs.apply
        run: |
          git config user.name "Luo Kai"
          git config user.email "luokai0@users.noreply.github.com"
          git add -A -- README.md ai-agent-skills docs
          if git diff --cached --quiet; then
            echo "No profile cleanup changes to commit"
            exit 1
          fi
          git commit -m "refactor: remove retired profile identifiers from consolidated skills [skip ci]"
          git push origin HEAD:main
