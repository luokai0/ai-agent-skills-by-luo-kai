name: Cross-platform compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-and-install:
    name: ${{ matrix.os }} checkout, validation, and skill install
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Scan every tracked path for Windows-incompatible names
        run: python .github/scripts/check_windows_paths.py

      - name: Validate every skill frontmatter block
        run: python .github/scripts/check_skill_frontmatter.py

      - name: Static skill security and provenance screening
        run: python .github/scripts/audit_skill_security.py --root . --report audit-report.json

      - name: Syntax-check adapted forensic helpers
        run: python -m py_compile "ai-agent-skills/21-external-registries/08-pinkpixel-collection/conducting-memory-forensics-with-volatility/scripts/agent.py" "ai-agent-skills/21-external-registries/08-pinkpixel-collection/hunting-for-scheduled-task-persistence/scripts/agent.py"

      - name: Install a real skill from the checked-out repository
        run: npx --yes skills add . --skill agents-md --agent codex --copy --yes
